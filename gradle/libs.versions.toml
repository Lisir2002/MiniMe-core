work = "2.12.0"

# Compose (BOM manages versions)
composeBom = "2025.12.01"

# Hilt
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"

# Network
retrofit = "2.11.0"
okhttp = "4.12.0"

# Kotlin
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.12.0"

# Ktor
ktor = "2.3.13"

# SQLDelight
sqldelight = "2.4.1"

# Database
sqlcipher = "4.5.4"

# Markdown
multiplatformMarkdown = "0.46.0"
