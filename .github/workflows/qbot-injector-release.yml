name: QBot Injector Release

# 打 qbot-injector-v* tag 时触发：构建 :injector-app:assembleRelease 并上传 APK 到 Release。
# 与主应用 android-release.yml、MiniMe Logs 的 logviewer-release.yml、QBot 的 qbot-release.yml 并行，互不影响。
#   tag 例：qbot-injector-v0.0.1 / qbot-injector-v0.0.1-rc1
#   产物：MiniMe-QBot-Injector-v0.0.1-release.apk（命名遵循 AGENTS.md「发版规范」§1：
#         {软件名}-{版本号}-{变体}.apk，变体为 release / rcN）
#
# 「MiniMe-QBot 环境注入器」是体积型运行资产（glibc rootfs / NapCat / apt 依赖池 / QQ 客户端）
# 的唯一承载者：一次性写入公共目录 /sdcard/MiniMeQBot/，供 :qbot-app 只读消费。
# 主应用因此得以瘦身到仅 PRoot 组件 + 代码（见 docs/qbot-injector-design.md）。
#
# 前置条件（均已满足；发版前仅需先录入 CHANGELOG-qbot-injector.md 本版条目）：
#   1. :injector-app 模块已存在并配置 release 签名（复用主应用唯一官方密钥）；
#   2. 版本推导已按 `git describe --match "qbot-injector-v[0-9]*"` 实现，版本号独立为 0.0.1 递增；
#   3. 独立版本日志 docs/Version Log/CHANGELOG-qbot-injector.md 已创建（release-log.py --app injector 的权威来源）。
on:
  push:
    tags:
      - 'qbot-injector-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release QBot Injector APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 版本号由 tag 推导、prev tag 由 git tag 查询得到，浅克隆拿不到 tag，
          # 必须拉完整历史（与主应用 android-release.yml 一致）。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          # 必须显式安装 NDK：Gradle 配置期会解析兄弟模块 :app（含 externalNativeBuild）的 NDK，
          # 缺失时由 AGP 隐式下载；该隐式下载一旦网络抖动损坏 zip，会以难以定位的报错中断发版。
          # 在此显式安装，使工具链依赖可见、失败点前移（与 qbot-release.yml 一致）。
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 补齐注入资产：apt 依赖闭包（~80MB）与官方 QQ 客户端 deb（~200MB）体积超 GitHub
      # 单文件 100MB 上限无法入库，由脚本在构建机侧抓取；容器底座 / 协议端本体 / 启动器已入库，
      # 脚本自动跳过（幂等）。
      - name: Fetch QBot offline assets
        run: python3 scripts/dev/fetch-qbot-offline-assets.py

      # 生成注入包清单 manifest.json（注入器随包资产的唯一事实源）：
      #   packVersion 由资产内容 sha256 派生，与 :qbot-app 的期望清单 pack-manifest.json 同批写出，
      #   保证「注入器产出的包」与「QBot 期望的包」版本必然一致（见 gen-qbot-pack-manifest.py）。
      - name: Generate pack manifest
        run: python3 scripts/dev/gen-qbot-pack-manifest.py

      # 校验 versionCode 单调递增：注入器的 versionCode = 三段版本号映射
      #   A*1000000 + B*1000 + C（与 injector-app/build.gradle.kts injectorGitVersionCode() 一致）。
      # prev tag 必须按本应用前缀 qbot-injector-v 过滤，避免被主应用 / QBot / Logviewer 的 tag 干扰。
      # 允许相等：rc 转正式版时常在同一提交上打 tag，versionCode 相等是正常的。
      # 仅打 qbot-injector-v* tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Verify versionCode monotonic
        if: startsWith(github.ref, 'refs/tags/qbot-injector-v')
        run: |
          set -e
          vc_of_tag() {
            local ver="${1#qbot-injector-v}"
            if [[ "$ver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc[0-9]+)?$ ]]; then
              echo $(( ${BASH_REMATCH[1]} * 1000000 + ${BASH_REMATCH[2]} * 1000 + ${BASH_REMATCH[3]} ))
            else
              echo 0
            fi
          }
          cur_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep '^qbot-injector-v' | grep -v "^${cur_tag}$" | head -1 || true)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 QBot Injector tag，跳过 versionCode 单调校验（首次发版）"
            echo "当前 tag 映射 versionCode = $(vc_of_tag "$cur_tag")"
            exit 0
          fi
          cur_vc=$(vc_of_tag "$cur_tag")
          prev_vc=$(vc_of_tag "$prev_tag")
          echo "上个 Release($prev_tag) versionCode = $prev_vc"
          echo "当前(${cur_tag}) versionCode     = $cur_vc"
          if [[ "$cur_vc" -lt "$prev_vc" ]]; then
            echo "::error::versionCode 回退: 当前 $cur_vc < 上个 Release($prev_tag) $prev_vc。请确保新 tag 版本号（三段式 x.x.x）在上个 Release 之上按语义推进。"
            exit 1
          fi
          echo "✓ versionCode 单调递增: $prev_vc -> $cur_vc"

      # 绑定发版门禁（强制）：本应用与 MiniMe-QBot 共享同一套运行环境资产，不可单独升级，
      # 必须同批一起发布。故要求同一提交上同时存在 qbot-v* Tag；缺失即失败
      # （见 AGENTS.md「发版规范 §1 · 绑定发版」与 docs/Version Log/README.md）。
      # 仅打 qbot-injector-v* tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Verify paired qbot tag
        if: startsWith(github.ref, 'refs/tags/qbot-injector-v')
        run: |
          set -e
          git fetch --tags --force >/dev/null 2>&1 || true
          paired=$(git tag --points-at HEAD | grep '^qbot-v[0-9]' || true)
          if [[ -n "$paired" ]]; then
            echo "✓ 已找到配对 QBot Tag: $(echo "$paired" | tr '\n' ' ')"
          else
            echo "::error::绑定发版门禁未通过：提交 $(git rev-parse --short HEAD) 上缺少 qbot-v* Tag。「MiniMe-QBot 环境注入器」与 MiniMe-QBot 为绑定应用，必须同批一起发布（两枚 Tag 打在同一提交上）。"
            exit 1
          fi

      - name: Build Injector Release APK
        run: ./gradlew :injector-app:assembleRelease --stacktrace

      - name: Rename APK
        id: rename
        run: |
          set -e
          # 形如 0.0.1 / 0.0.1-rc1 → 提取基础版本号与变体
          tag="${GITHUB_REF_NAME}"          # qbot-injector-v0.0.1 / qbot-injector-v0.0.1-rc1
          ver="${tag#qbot-injector-v}"      # 0.0.1 / 0.0.1-rc1
          if [[ "$ver" =~ ^([0-9.]+)-(rc[0-9]+)$ ]]; then
            base_ver="${BASH_REMATCH[1]}"
            variant="${BASH_REMATCH[2]}"
          else
            base_ver="$ver"
            variant="release"
          fi
          src="injector-app/build/outputs/apk/release/injector-app-release.apk"
          out="dist/MiniMe-QBot-Injector-v${base_ver}-${variant}.apk"
          mkdir -p dist
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "INJECTOR_VER=$ver" >> "$GITHUB_ENV"
          echo "packaged $out"
          ls -lh "$out"

      - name: Verify signature
        run: |
          set -e
          APK="${{ steps.rename.outputs.apk }}"
          echo "--- apksigner verify ---"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | head -3
          echo "--- APK size ---"
          ls -lh "$APK"

      # 生成附属应用发版说明草稿：
      #   --app injector  → 用注入器的 tag 前缀与独立版本日志（docs/Version Log/CHANGELOG-qbot-injector.md）
      #   --path injector-app → 仅统计 injector-app 目录下的提交，隔离其它应用提交
      - name: Generate release notes
        id: changelog
        run: |
          set -e
          cur_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep '^qbot-injector-v' | grep -v "^${cur_tag}$" | head -1 || true)
          version="${cur_tag#qbot-injector-v}"

          # 用数组拼参数，避免在 ${var:+...} 里嵌套引号造成的词法歧义
          notes_args=(--app injector --path injector-app --cur "$cur_tag" --version "$version" --date "$(date +%Y-%m-%d)")
          if [ -n "$prev_tag" ]; then
            notes_args+=(--prev "$prev_tag")
          fi

          delimiter="EOF_$(date +%s)"
          {
            echo "body<<${delimiter}"
            python3 scripts/gitops/release-log.py "${notes_args[@]}"
            echo ""
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # 保留已更新的 Release 内容（与主应用 / QBot / Logviewer 逻辑一致）
      - name: Preserve existing release content
        id: preserve
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cur_tag="${GITHUB_REF_NAME}"
          delimiter="EOF_$(date +%s)"

          existing=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${cur_tag}" || echo "")

          final_body="${{ steps.changelog.outputs.body }}"
          final_name="MiniMe-QBot Injector v${INJECTOR_VER}"

          if echo "$existing" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('id') else 1)" 2>/dev/null; then
            existing_body=$(echo "$existing" | python3 -c "import json,sys; print(json.load(sys.stdin).get('body',''))")
            existing_name=$(echo "$existing" | python3 -c "import json,sys; print(json.load(sys.stdin).get('name',''))")

            if ! echo "$existing_body" | grep -qE "请补充|请提炼|_（"; then
              final_body="$existing_body"
            fi
            if echo "$existing_name" | grep -q "—"; then
              final_name="$existing_name"
            fi
          fi

          {
            echo "body<<${delimiter}"
            echo "$final_body"
            echo "${delimiter}"
            echo "name<<${delimiter}"
            echo "$final_name"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # 发版格式硬校验门禁（与主应用 / QBot / Logviewer 一致）
      - name: Validate release notes (hard checks)
        run: |
          set -e
          body="${{ steps.preserve.outputs.body }}"
          echo "--- 硬校验：emoji ---"
          if echo "$body" | grep -qP '[\x{1F300}-\x{1F9FF}]|[\x{2600}-\x{27BF}]'; then
            echo "::error::Release 正文包含 emoji，违反发版规范"
            exit 1
          fi
          echo "  PASS: 无 emoji"
          echo "--- 硬校验完成 ---"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 标题基础格式「MiniMe-QBot Injector v{版本号}」，发版后必须手动补充「— 更新内容概括」（≤20字，用户语言）
          name: ${{ steps.preserve.outputs.name }}
          body: ${{ steps.preserve.outputs.body }}
          files: |
            ${{ steps.rename.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
