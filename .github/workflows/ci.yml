name: CI

# push 到 main 或 PR 时触发：构建 release（签名不存在则 unsigned）+ 跑 release 变体单元测试。
# 用户策略：所有测试/验证都用发行版（release），不打 debug，也不发 debug。
# 所以 CI 门禁统一跑 release 链路：
#   :app:assembleRelease        — R8 fullMode + 资源收缩 + DEX/SO ZIP 压缩都走一遍，
#                                 真正验证"即将发出的包"能不能构出来（14MB 级最终产物）。
#   :app:testReleaseUnitTest    — 纯 JVM 单测在 release classpath 下跑，
#                                 与将来用户安装的 release 运行时一致（debug 专用代码路径不再被掩盖）。
# 打 v* tag 的正式发版构建走 android-release.yml（额外有 keystore 还原 + Release 页上传），不在这里。
on:
  push:
    branches: [ main ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode/versionName 由 build.gradle.kts 的 gitVersionCode()/gitVersionName() 在配置阶段
          # 基于 git tag 推导，浅克隆（默认 depth=1）会拿不到 tag，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # skill 脚本语法冒烟护栏：内置技能入口脚本运行于 Alpine(busybox ash)，语法必须兼容 POSIX sh。
      # 用 sh -n（dash 解析，与 busybox ash 同为 POSIX 语法）对所有 SCRIPT 型技能入口做语法校验，
      # 防止 gawk/GNU 专属语法（\x{...}、\s、\d）合入导致容器内执行即崩。
      - name: Check skill script syntax (sh -n)
        run: |
          set -e
          find app/src/main/assets/skills -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            echo "==> sh -n $f"
            sh -n "$f"
          done
          echo "All skill scripts pass POSIX sh syntax check"

      # CI 预检查：编译前自动拦截常见错误，避免等到 Lint/编译阶段才失败（耗时几秒，节省十几分钟）。
      # 检查项：strings 文件 translatable 属性、禁止 values-en 目录、
      #         Compose 中禁止直接 LocalContext.current.getString()、@SuppressLint import 检查、密钥安全检查。
      # 脚本见 scripts/ci/pre-build-check.py。
      - name: CI pre-build check (auto-catch common errors)
        run: |
          set -e
          python3 scripts/ci/pre-build-check.py

      # 数据持久化静态检查：防止 putJson/getString 读写列不匹配、Singleton 状态硬编码等
      # 导致"设置项重启后丢失"类 bug。脚本见 scripts/dev/check-persistence.py。
      - name: Persistence static check
        run: |
          set -e
          python3 scripts/dev/check-persistence.py

      # 安全门禁：检测 EncryptedDriverFactory 是否仍为空实现（P0 级安全修复回归检测）。
      # 历史上 CipherDriverFactory.create() 直接 throw error("...尚未启用...")，
      # 导致所有 6 个数据库以明文 SQLite 落盘。此步骤防止该空实现被意外回退。
      # 2026-09-28：加密架构重构，CipherDriverFactory 已替换为 EncryptedDriverFactory。
      - name: "Security gate: EncryptedDriverFactory not stub"
        run: |
          set -e
          CIPHER_FILE="app/src/main/java/com/mini/me_core/datalayer/encryption/EncryptedDriverFactory.kt"
          if [ ! -f "$CIPHER_FILE" ]; then
            echo "::error::Security gate FAILED: EncryptedDriverFactory does not exist."
            echo "  File: $CIPHER_FILE"
            echo "  The encrypted driver factory must exist to ensure database encryption."
            exit 1
          fi
          if grep -q '尚未启用\|not implemented\|TODO.*encrypt' "$CIPHER_FILE"; then
            echo "::error::Security gate FAILED: EncryptedDriverFactory is still a stub (empty implementation)."
            echo "  File: $CIPHER_FILE"
            echo "  The create() method must implement SQLCipher SupportFactory, not throw error()."
            exit 1
          fi
          # 同时检测是否真的引用了 SQLCipher SupportFactory
          if ! grep -q 'SupportFactory' "$CIPHER_FILE"; then
            echo "::error::Security gate FAILED: EncryptedDriverFactory does not reference net.sqlcipher.database.SupportFactory."
            echo "  File: $CIPHER_FILE"
            exit 1
          fi
          echo "Security gate passed: EncryptedDriverFactory is fully implemented with SQLCipher SupportFactory."

      # CI 跑 Ubuntu runner：自动生成 debug keystore + keystore.properties 供 signingConfigs 配置阶段通过。
      # 必须放在 Set up JDK 之后（keytool 是 JDK bin 下的工具，JAVA_HOME 未注入前调不到）。
      # build.gradle.kts 的 signingConfigs.release 块在配置阶段就会 require(keystore.properties 存在)，
      # 即使只跑 compileReleaseKotlin 也会触发，因此必须在此步骤创建 app/keystore.properties。
      # 注意：ci.yml 只跑编译/单测/Lint，不跑 assembleRelease，所以用 debug keystore 兜底是安全的——
      # 真正的 release 打包签名由 android-release.yml 从 GitHub Secrets 恢复唯一官方密钥完成。
      - name: Generate debug keystore + keystore.properties (CI config fallback)
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          mkdir -p ~/.android
          if [[ ! -f ~/.android/debug.keystore ]]; then
            "$JAVA_HOME/bin/keytool" -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "debug keystore created at ~/.android/debug.keystore"
          else
            echo "debug keystore already exists, skip creation"
          fi
          # 复制 debug keystore 到 app/minime.jks，创建 app/keystore.properties 供配置阶段通过
          cp ~/.android/debug.keystore app/minime.jks
          cat > app/keystore.properties << EOF
          storeFile=minime.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          echo "✓ app/keystore.properties 已创建（CI 配置兜底，仅用于编译/单测/Lint，不用于正式打包）"
          ls -la app/minime.jks app/keystore.properties

      - name: Set up Android SDK (use pre-installed + manual install)
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "--- pre-installed SDK contents ---"
          ls -la $ANDROID_HOME/ || true
          echo "--- build-tools ---"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"
          echo "--- platforms ---"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms"
          echo "--- cmdline-tools ---"
          find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null || echo "no sdkmanager"
          SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found, downloading cmdline-tools..."
            curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p $ANDROID_HOME/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
            rm -f /tmp/cmdline-tools.zip
          fi
          echo "--- verify installation ---"
          ls $ANDROID_HOME/build-tools/
          ls $ANDROID_HOME/platforms/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 用只读缓存，仅 main 的 push 写回缓存，避免被 PR 污染。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: |
          set -e
          chmod +x ./gradlew
          # 构建前先打印环境：避免 gradle.properties 里有硬编码路径导致 "Java home does not exist"
          echo "--- build env sanity ---"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la gradle.properties gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle properties (without sensitive values) ---"
          grep -vE '^(systemProp\.)' gradle.properties || true

      # CI 门禁（main push / PR）：只编译 + 单测 + Lint，不跑 assembleRelease。
      # 原因：release 打包必须使用唯一官方签名密钥（keystore.properties），该密钥仅在 tag 触发的
      # android-release.yml 中从 GitHub Secrets 恢复；main push 无密钥，assembleRelease 必失败。
      # compileReleaseKotlin 只编译不打包，能验证 release 变体代码可编译，无需签名。
      # testReleaseUnitTest 在 release classpath 下跑单测，与用户最终安装的 release 运行时一致。
      # lintRelease 提前发现 Lint 错误，避免等到发版时才在 android-release.yml 中失败。
      # --warning-mode=all 把所有弃用告警打到日志，便于提前发现 R8/AGP 升级时的破坏性变更；
      # --stacktrace 失败时打印完整异常栈，便于在 CI 一眼定位根因。
      - name: Compile release (code smoke, no signing)
        run: ./gradlew --warning-mode=all :app:compileReleaseKotlin --stacktrace

      # 单元测试（app/src/test 下的 Kotlin 单测），在 release 变体 classpath 下执行：
      # 与用户拿到的最终发布包运行时一致，避免 debug-only 代码掩盖问题。
      - name: Run unit tests (release)
        run: ./gradlew --warning-mode=all :app:testReleaseUnitTest --stacktrace

      # Lint 门禁（baseline 渐进式）：app/lint-baseline.xml 收录存量 error 视为已知，
      # abortOnError=true 下任何「新增 error」都会让本步骤失败、阻断合并；warning 不阻断。
      # 与 android-release.yml 的 Lint 步骤保持一致，提前在 CI 阶段发现问题。
      - name: Lint (release, baseline gate)
        run: ./gradlew --warning-mode=all :app:lintRelease --stacktrace
