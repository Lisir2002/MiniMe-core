name: Android Release

# 打 Tag（如 v1.0.0）时触发：构建「真机 + 虚拟环境通用」的 Release APK（双 ABI：arm64-v8a + x86_64）。
#   - 单包通用（用户决策「不分包」）：同一 APK 同时携带 arm64-v8a 与 x86_64 两套原生库，
#     Android 包管理器安装/运行期按设备 ABI 自动选用——真机（arm64）与 x86_64 模拟器都安装即用，
#     无需用户选择、不存在「误装到 x86_64 模拟器」的问题（详见 docs/plan-docs/emulator-support-design.md）。
#   - 容器 rootfs 同理双架构打入（container/arm + container/x86_64），运行时按宿主架构选装/选用。
# 创建 GitHub Release 并把 APK 作为资产发布。
on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发，便于验证构建链路。
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 与上传资产需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode 由 build.gradle.kts 的 gitVersionCode() 取 git tag 四段版本号映射生成
          # （BASE + A*1e9 + B*1e7 + C*1e4 + D*10），与提交历史解耦——rebase/squash 改写历史不影响单调性。
          # 浅克隆（默认 depth=1）会拿不到 tag，versionName/versionCode 推导错乱，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 【签名策略 · 唯一官方密钥】正式 release 一律使用「唯一官方 keystore」：
      #   app/minime.jks + app/keystore.properties（已按维护者决定**入库**，见 .gitignore / branding.gradle.kts「签名策略」），
      #   本地与 CI 每次构建加载同一把密钥，签名指纹恒定。
      # 故此处**不再**需要从 CI secrets 恢复 keystore / 生成 keystore.properties（旧策略，已移除）。
      # app/ 下的 minime.jks 与 keystore.properties 随 checkout 自带，Gradle signingConfigs.release 直接读取，
      # 缺少即构建失败（require 强制），不存在「静默回退 debug keystore 当正式签名」。
      # debug keystore（~/.android/debug.keystore）仅由 AGP 开发期自动生成用于 debug 构建，release 与它无关。
      - name: Set up Android SDK (use pre-installed + manual install)
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "--- pre-installed SDK contents ---"
          ls -la $ANDROID_HOME/ || true
          echo "--- build-tools ---"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"
          echo "--- platforms ---"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms"
          echo "--- cmdline-tools ---"
          find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null || echo "no sdkmanager"
          SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found, downloading cmdline-tools..."
            curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p $ANDROID_HOME/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
            rm -f /tmp/cmdline-tools.zip
          fi
          echo "--- verify installation ---"
          ls $ANDROID_HOME/build-tools/
          ls $ANDROID_HOME/platforms/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 复用 Gradle 构建缓存，加速后续构建。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 读取品牌参数（单一事实源：app/branding.gradle.kts，与 app/build.gradle.kts 共享同源）。
      # 用 grep 提取 APK_PREFIX / KEYSTORE_FILE / APP_NAME 到 GITHUB_ENV，后续所有产物名/keystore
      # 引用统一起自这里，避免在 workflow 里重复硬编码品牌名导致"改配置但 CI 还沿用旧名"。
      - name: Read branding config (single source)
        run: |
          set -e
          APK_PREFIX=$(grep -oE 'APK_PREFIX = "[^"]+"' app/branding.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          KEYSTORE_FILE=$(grep -oE 'KEYSTORE_FILE = "[^"]+"' app/branding.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_NAME=$(grep -oE 'APP_NAME = "[^"]+"' app/branding.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APK_PREFIX=$APK_PREFIX" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "branding: APK_PREFIX=$APK_PREFIX / KEYSTORE_FILE=$KEYSTORE_FILE / APP_NAME=$APP_NAME"
          : "${APK_PREFIX:?branding 读取失败: APK_PREFIX 为空}"
          : "${KEYSTORE_FILE:?branding 读取失败: KEYSTORE_FILE 为空}"
          : "${APP_NAME:?branding 读取失败: APP_NAME 为空}"

      - name: Grant execute permission for gradlew + env sanity
        run: |
          set -e
          chmod +x ./gradlew
          echo "--- build env sanity ---"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la gradle.properties gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle properties (without sensitive values) ---"
          grep -vE '^(systemProp\.)' gradle.properties || true

      # 打印当前 Tag，Tag 驱动直接生成 versionName。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Display release tag info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag_ver="${GITHUB_REF_NAME#v}"            # 1.7.0 / 1.7.0-rc1 / ...
          echo "tag version (without v) = $tag_ver"
          echo "✓ tag 将直接驱动应用 versionName ($tag_ver)"

      # 校验 versionCode 单调递增：versionCode = git tag 四段版本号映射（见 build.gradle.kts gitVersionCode()），
      # 与提交数无关，rebase/squash 改写历史不影响单调性；此处按同一映射比较当前 tag 与上个 Release tag。
      # 允许相等：rc 转正式版时常在同一提交上打 tag，versionCode 相等是正常的。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Verify versionCode monotonic
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          vc_of_tag() {
            local ver="${1#v}"
            if [[ "$ver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)(-rc[0-9]+)?$ ]]; then
              echo $(( 10000000 + ${BASH_REMATCH[1]} * 1000000000 + ${BASH_REMATCH[2]} * 10000000 + ${BASH_REMATCH[3]} * 10000 + ${BASH_REMATCH[4]} * 10 ))
            else
              echo 0
            fi
          }
          cur_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${cur_tag}$" | head -1)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，跳过 versionCode 单调校验（首次发版）"
            echo "当前 tag 映射 versionCode = $(vc_of_tag "$cur_tag")"
            exit 0
          fi
          cur_vc=$(vc_of_tag "$cur_tag")
          prev_vc=$(vc_of_tag "$prev_tag")
          echo "上个 Release($prev_tag) versionCode = $prev_vc"
          echo "当前(${cur_tag}) versionCode     = $cur_vc"
          if [[ "$cur_vc" -lt "$prev_vc" ]]; then
            echo "::error::versionCode 回退: 当前 $cur_vc < 上个 Release($prev_tag) $prev_vc。请确保新 tag 版本号（四段式 x.x.x.x）在上个 Release 之上按语义推进。"
            exit 1
          fi
          echo "✓ versionCode 单调递增: $prev_vc -> $cur_vc"

      # 数据保全门禁：校验 applicationId（包名）与上个 Release 一致。
      # 背景：包名（applicationId）变更在 Android 眼里是"全新安装"，私有数据目录随之隔离，
      #       用户历史对话会全部"消失"。因此发版必须保持同包名，不一致直接阻断。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Verify applicationId stability
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          cur_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${cur_tag}$" | head -1)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，跳过 applicationId 一致性校验（首次发版）"
            exit 0
          fi
          extract_id() { git show "$1:app/build.gradle.kts" | grep -oE 'applicationId = "[^"]+"' | head -1 | sed -E 's/.*"([^"]+)".*/\1/'; }
          cur_id=$(extract_id "$cur_tag")
          prev_id=$(extract_id "$prev_tag")
          echo "上个 Release($prev_tag) applicationId = $prev_id"
          echo "当前(${cur_tag}) applicationId        = $cur_id"
          if [[ -z "$prev_id" || "$cur_id" != "$prev_id" ]]; then
            echo "::error::applicationId 变更: $prev_id -> $cur_id。包名变更在 Android 上是全新安装，会导致用户历史对话不可见。禁止变更 applicationId。"
            exit 1
          fi
          echo "✓ applicationId 校验通过: $cur_id"

      # 签名：唯一官方 keystore + properties 已入库，随 checkout 自带（见上方「签名策略」注释）。
      # 发版质量门禁：跑 release 变体单元测试（用户策略 = 所有测试/验证都用发行版），
      # 与用户实际安装的 release classpath 一致，不再被 debug 专用代码路径掩盖。
      # （纯 JVM 单测不依赖真机 ABI，与 arm64-only 的打包策略无冲突。）
      # --warning-mode=all + --stacktrace：失败时完整输出弃用告警与异常栈，避免在 CI 再猜。
      - name: Run unit tests (release)
        run: ./gradlew --warning-mode=all :app:testReleaseUnitTest --stacktrace

      # 构建通用 release APK（双 ABI：arm64-v8a + x86_64，见 build.gradle.kts abiFilters 与 sourceSets）
      # --warning-mode=all + --stacktrace：失败时完整输出，便于在 CI 一眼定位 R8/打包/OOM 根因
      - name: Build Release APK
        run: ./gradlew --warning-mode=all assembleRelease --stacktrace

      # 重命名 APK 为「软件名-版本号-变体」格式（品牌前缀来自 branding.gradle.kts 的 APK_PREFIX）：
      #   MiniMe-v0.0.15-release.apk（正式版）
      #   MiniMe-v0.0.16-rc1.apk（预览版）
      # 变体规则：tag 含 -rcN → 变体=rcN；否则 → release
      - name: Rename APK
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME:-manual}"   # tag 如 v0.0.15 或 v0.0.16-rc1；手动触发时为 manual-N
          # 提取基础版本号（去掉预发布后缀）和变体
          if [[ "$ver" =~ ^(v[0-9.]+)-(rc[0-9]+)$ ]]; then
            base_ver="${BASH_REMATCH[1]}"
            variant="${BASH_REMATCH[2]}"
          elif [[ "$ver" =~ ^(v[0-9.]+)-(dev|beta|alpha)[0-9]*$ ]]; then
            base_ver="${BASH_REMATCH[1]}"
            variant="${BASH_REMATCH[2]}"
          else
            base_ver="$ver"
            variant="release"
          fi
          echo "APK_BASE_VER=$base_ver" >> "$GITHUB_ENV"
          echo "APK_VARIANT=$variant" >> "$GITHUB_ENV"
          src="app/build/outputs/apk/release/app-release.apk"
          if [[ -f "$src" ]]; then
            out="dist/${APK_PREFIX}-${base_ver}-${variant}.apk"
            cp "$src" "$out"
            echo "packaged $out"
            ls -lh "$out"
            # 产物校验：通用包必须同时包含 arm64-v8a 与 x86_64 两套原生库（解 zip 列出 lib/ 下架构目录）
            echo "--- ABI 校验：lib/ 下应有 arm64-v8a 与 x86_64 ---"
            unzip -l "$out" | awk '/\.so$/ {print $4}' | awk -F/ 'NF>=3 {print $2}' | sort -u
            has_arm=$(unzip -l "$out" | grep -c 'lib/arm64-v8a/.*\.so' || true)
            has_x86=$(unzip -l "$out" | grep -c 'lib/x86_64/.*\.so' || true)
            if [[ "$has_arm" -eq 0 || "$has_x86" -eq 0 ]]; then
              echo "::error::ABI 校验失败：arm64-v8a($has_arm) / x86_64($has_x86) 未同时包含，请检查 build.gradle.kts abiFilters=[arm64-v8a,x86_64] 与双架构资产。"
              exit 1
            fi
            echo "✓ ABI 校验通过：arm64-v8a + x86_64 双架构齐备"
          else
            echo "::error::missing $src — assembleRelease 产出未找到，请检查 build.gradle.kts 已移除 flavor 且 abiFilters 含 arm64-v8a 与 x86_64。"
            exit 1
          fi

      # 上传 R8 mapping.txt 作为 Run artifact（仅 release build 才会产出）。
      # 用于线上 crash stack 反混淆与版本回溯。文件不存在时跳过，不阻塞流程。
      - name: Upload R8 mapping (Run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      # RC70 新增：独立上传 APK artifact（Rename → Release 创建之间的安全网）
      # 即使 Create GitHub Release step 因 tag 竞态 / GITHUB_TOKEN 权限失败，APK 仍在 Run Artifacts 内 90 天可下载。
      - name: Upload release APK (Run artifact safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          # 用 ${{ env.APK_PREFIX }} 表达式展开（幂等动作的 path 是字面量，${APK_PREFIX} 不会自动展开）
          path: dist/${{ env.APK_PREFIX }}-**.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Determine release name
        id: release
        run: |
          # 手动触发（无 tag）时用 run id 作为临时名，避免破坏 tag 发布。
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine prerelease flag
        id: prerelease
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if [[ "$tag" =~ -(rc|dev|beta|alpha)([.0-9]*)?$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "检测到预发布后缀，标记为 pre-release"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "正式版，不标记 pre-release"
          fi

      # GitHub 的 generate_release_notes 只列 merged PR，直接 push 的 commit 不会出现。
      # 本仓库在 main 上直接 commit，不走 PR 流程，所以手动用 release-log.py 生成 Release 正文草稿。
      # 发版规范见 AGENTS.md「发版说明格式（硬性约束）」——统一格式，CHANGELOG/独立文档/Release正文三处一致。
      #   AI/维护者发版后需补充「更新内容概括」到 Release 标题，并把条目润色为「**4-9字小标题**：20-40字说明」格式。
      - name: Generate release notes
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cur_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${cur_tag}$" | head -1)
          version="${cur_tag#v}"
          # 多行输出用 EOF 分隔符；release-log.py 直接产出 Release 正文草稿
          delimiter="EOF_$(date +%s)"
          # 多行输出：必须把 python 产出的正文「整体重定向」进 GITHUB_OUTPUT，
          #   不能分开 append（python 的 stdout 默认不会进文件，只进步骤日志）。
          {
            echo "body<<${delimiter}"
            python3 scripts/gitops/release-log.py \
              --prev "$prev_tag" \
              --cur "$cur_tag" \
              --version "$version" \
              --date "$(date +%Y-%m-%d)"
            echo ""
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload assets
        uses: softprops/action-gh-release@v2
        id: gh_release
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          # 标题基础格式「MiniMe 版本号」，AI/维护者发版后需补充「— 更新内容概括」（≤20字，用户语言）
          name: MiniMe ${{ env.APK_BASE_VER }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          # 产物名约定 <APK_PREFIX>-<版本号>-<变体>.apk（见 Rename 步骤），通配符兼容 release/rcN。
          # ${APK_PREFIX} 在此处是字面量不会展开，须用 ${{ env.APK_PREFIX }} 表达式。
          files: |
            dist/${{ env.APK_PREFIX }}-**.apk
        env:
          # RC70 修复：softprops action 对 tag/release 写操作 + 附件 upload 用 GH_RELEASE_TOKEN (细粒度 PAT)，
          # 避免默认 secrets.GITHUB_TOKEN 在 tag 已经存在 + repo 限制 Release write / tag push 时竞态失败。
          # 回退：secrets.GH_RELEASE_TOKEN 未配置时自动回退为 GITHUB_TOKEN（保持原行为）。
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # 把版本号、prerelease 标志、APK 下载链接、Release 页面写入 Run Summary，
      # 方便 AI / 维护者通过 GitHub API 或 Actions 页面一眼定位产物（与 docs/ci-release.md 云端构建发版运维手册 对齐）。
      - name: Write download URLs to Run Summary
        if: always()
        env:
          TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
          REPO: ${{ github.repository }}
        run: |
          apk="dist/${APK_PREFIX}-${APK_BASE_VER}-${APK_VARIANT}.apk"
          sha256="$(sha256sum "$apk" 2>/dev/null | cut -d' ' -f1 || echo unavailable)"
          {
            echo "## ${APP_NAME} Release — ${TAG}"
            echo ""
            echo "- **Prerelease**: ${IS_PRERELEASE}"
            echo "- **APK**: \`${APK_PREFIX}-${APK_BASE_VER}-${APK_VARIANT}.apk\` (双 ABI 通用包：arm64-v8a + x86_64)"
            echo "- **SHA256**: \`${sha256}\`"
            echo "- **Release page**: https://github.com/${REPO}/releases/tag/${TAG}"
            echo "- **Artifact**: r8-mapping-${TAG} (Run artifact, 90d retention)"
          } >> "$GITHUB_STEP_SUMMARY"
