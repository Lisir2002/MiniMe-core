name: Secret Scan

# 密钥泄露门禁：对全量 git 历史（fetch-depth: 0）跑 gitleaks，
# 发现疑似密钥（API Key / token / keystore 口令 / 私钥）即失败。
#
# 背景（2026-10-13 审计 P0）：Release 签名私钥 app/minime.jks 与明文口令
# app/keystore.properties 曾随公开仓库分发（移除于 51315fc0），历史仍可提取。
# 本门禁是防复发措施；根治（轮换签名密钥）见 SECURITY.md「签名密钥历史泄露事件」。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 PR 上以评论形式报告（开源仓库 gitleaks-action v2 免费）
          GITLEAKS_ENABLE_COMMENTS: "true"
          # 只对引入的提交生效的宽松模式由 action 默认处理；全量历史扫描：
          GITLEAKS_SCAN_MODE: "git"
