name: QBot Release

# 独立发版：MiniMe-QBot（`qbot-v*`）与「MiniMe-QBot 环境注入器」（`qbot-injector-v*`）
# **谁更新就推谁的 Tag**，本工作流按 Tag 前缀分流，只构建并发布对应的那一款（见 AGENTS.md「发版规范 §1」）。
#
# 两侧的运行环境兼容由**注入包契约号**（注入器写入注入包的 `manifest.json` 里的 `contractVersion`）保证：
#   注入器仅更新环境资源（内容变化、契约号不变）→ 旧版 QBot 直接可用，无需同步发版；
#   仅当资产种类 / 目录布局变化（契约号 +1）时，才需 QBot 一并发版。
# （见 docs/qbot-injector-design.md「版本与兼容」）
#
# 触发：推 `qbot-v*` 或 `qbot-injector-v*` Tag；workflow_dispatch 需选择目标 Tag。
#   tag 例：qbot-v0.0.1-rc15          → 产物 MiniMe-QBot-v0.0.1-rc15.apk
#           qbot-injector-v0.0.8-rc1  → 产物 MiniMe-QBot-Injector-v0.0.8-rc1.apk
#          （命名遵循 AGENTS.md「发版规范」§1：{软件名}-{版本号}-{变体}.apk，变体为 release / rcN）
#
# 说明：体积型环境资产（glibc rootfs / NapCat / apt 依赖池 / QQ 客户端 / 启动器）只在**注入器**
# 构建时才抓取并打入其 APK；QBot 本体只内置 PRoot 组件与期望清单，构建不需要这些大件
# （故 QBot 发版更轻更快）。资产抓取与清单生成仅对注入器执行，二者随包清单仍同批生成。
#
# 前置条件（均已满足；发版前仅需先录入该应用本版版本日志条目）：
#   1. :qbot-app / :injector-app 均已配置 release 签名（复用主应用唯一官方密钥）；
#   2. 版本推导分别按 `git describe --match "qbot-v[0-9]*"` / `"qbot-injector-v[0-9]*"` 实现，
#      两应用版本号各自独立递增；
#   3. 独立版本日志 docs/Version Log/CHANGELOG-qbot.md 与 CHANGELOG-qbot-injector.md 已创建
#      （release-log.py --app qbot / --app injector 的权威来源）。
on:
  push:
    tags:
      - 'qbot-v*'
      - 'qbot-injector-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 版本号由 tag 推导、prev tag 由 git tag 查询得到，浅克隆拿不到 tag，
          # 必须拉完整历史（与主应用 android-release.yml 一致）。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          # 必须显式安装 NDK：Gradle 会配置 :qbot-app / :injector-app 依赖的兄弟模块 :app
          # （含 externalNativeBuild），配置期即解析 NDK，缺失时由 AGP 隐式下载；该隐式下载一旦
          # 网络抖动损坏 zip，会以「Failed to install the following SDK components」这种难以定位的
          # 报错中断发版。在此显式安装，使工具链依赖可见、失败点前移。
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 由触发 Tag 的前缀决定本次发布哪一款应用（独立发版：一次只发一款）。
      - name: Resolve release target
        id: target
        run: |
          set -e
          ref="${GITHUB_REF_NAME}"
          git fetch --tags --force >/dev/null 2>&1 || true

          if [[ "$ref" =~ ^qbot-v[0-9] ]]; then
            app=qbot
            prefix="qbot-v"
            app_name="MiniMe-QBot"
            module=":qbot-app:assembleRelease"
            apk_src="qbot-app/build/outputs/apk/release/qbot-app-release.apk"
            apk_prefix="MiniMe-QBot"
            app_path="qbot-app"
          elif [[ "$ref" =~ ^qbot-injector-v[0-9] ]]; then
            app=injector
            prefix="qbot-injector-v"
            app_name="MiniMe-QBot Injector"
            module=":injector-app:assembleRelease"
            apk_src="injector-app/build/outputs/apk/release/injector-app-release.apk"
            apk_prefix="MiniMe-QBot-Injector"
            app_path="injector-app"
          else
            echo "::error::本工作流仅由 qbot-v* / qbot-injector-v* Tag 触发（当前 ref: ${ref}）。手动触发（workflow_dispatch）时请选择目标 Tag。"
            exit 1
          fi

          ver="${ref#"$prefix"}"
          echo "✓ 本次发布目标：${app_name} ${ref}"
          {
            echo "app=${app}"
            echo "prefix=${prefix}"
            echo "app_name=${app_name}"
            echo "app_path=${app_path}"
            echo "module=${module}"
            echo "apk_src=${apk_src}"
            echo "apk_prefix=${apk_prefix}"
            echo "tag=${ref}"
            echo "ver=${ver}"
          } >> "$GITHUB_OUTPUT"

      # 校验该应用的 versionCode 单调递增（各应用命名空间独立，互不干扰）：
      #   versionCode = 三段版本号映射 A*1000000 + B*1000 + C
      #   （与 qbot-app / injector-app build.gradle.kts 的 gitVersionCode() 一致）。
      # prev tag 必须按本应用前缀过滤，避免被主应用 / Logviewer / 另一款应用的 tag 干扰。
      # 允许相等：rc 转正式版时常在同一提交上打 tag，versionCode 相等是正常的。
      - name: Verify versionCode monotonic
        env:
          APP_PREFIX: ${{ steps.target.outputs.prefix }}
          APP_VER: ${{ steps.target.outputs.ver }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
        run: |
          set -e
          if [[ "$APP_VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc[0-9]+)?$ ]]; then
            cur_vc=$(( ${BASH_REMATCH[1]} * 1000000 + ${BASH_REMATCH[2]} * 1000 + ${BASH_REMATCH[3]} ))
          else
            cur_vc=0
          fi
          prev_tag=$(git tag --sort=-creatordate | grep -E "^${APP_PREFIX}[0-9]" | grep -v -F "${APP_PREFIX}${APP_VER}" | head -1 || true)
          if [[ -z "$prev_tag" ]]; then
            echo "[$APP_NAME] 无历史 Tag，跳过 versionCode 单调校验（首次发版）；当前映射 versionCode = $cur_vc"
            exit 0
          fi
          prev_ver="${prev_tag#"$APP_PREFIX"}"
          if [[ "$prev_ver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc[0-9]+)?$ ]]; then
            prev_vc=$(( ${BASH_REMATCH[1]} * 1000000 + ${BASH_REMATCH[2]} * 1000 + ${BASH_REMATCH[3]} ))
          else
            prev_vc=0
          fi
          echo "[$APP_NAME] 上个 Release($prev_tag) versionCode = $prev_vc；当前 versionCode = $cur_vc"
          if [[ "$cur_vc" -lt "$prev_vc" ]]; then
            echo "::error::[$APP_NAME] versionCode 回退: 当前 $cur_vc < 上个 Release($prev_tag) $prev_vc。请确保新 tag 版本号（三段式 x.x.x）在上个 Release 之上按语义推进。"
            exit 1
          fi
          echo "[$APP_NAME] ✓ versionCode 单调递增: $prev_vc -> $cur_vc"

      # ── 以下两步仅注入器需要：体积资产不入库（GitHub 单文件 100MB 上限），
      #    构建机侧抓取 apt 依赖闭包（~80MB）与官方 QQ 客户端 deb（~200MB）；
      #    容器底座 / 协议端本体 / 启动器已入库，脚本自动跳过（幂等）。QBot 不含这些大件，
      #    故其发版不走这两步，构建更快。
      - name: Fetch QBot offline assets
        if: steps.target.outputs.app == 'injector'
        run: python3 scripts/dev/fetch-qbot-offline-assets.py

      # 生成注入包清单（注入器随包资产与 QBot 期望清单的唯一事实源）：
      #   同一次运行写出两份**字节完全一致**的清单（_qbotAssets/manifest.json 与
      #   assets/qbot/pack-manifest.json），两侧契约号必然一致，不会出现「QBot 拒收注入包」。
      - name: Generate pack manifest
        if: steps.target.outputs.app == 'injector'
        run: python3 scripts/dev/gen-qbot-pack-manifest.py

      - name: Build Release APK
        env:
          APP_NAME: ${{ steps.target.outputs.app_name }}
          MODULE: ${{ steps.target.outputs.module }}
        run: |
          set -e
          echo "构建 ${APP_NAME} → ${MODULE}"
          ./gradlew "$MODULE" --stacktrace

      - name: Rename APK
        id: rename
        env:
          APK_SRC: ${{ steps.target.outputs.apk_src }}
          APK_PREFIX: ${{ steps.target.outputs.apk_prefix }}
          APP_VER: ${{ steps.target.outputs.ver }}
        run: |
          set -e
          # 形如 0.0.1-rc9 / 0.0.2-rc1 → 提取基础版本号与变体
          if [[ "$APP_VER" =~ ^([0-9.]+)-(rc[0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"
            variant="${BASH_REMATCH[2]}"
          else
            base="$APP_VER"
            variant="release"
          fi
          mkdir -p dist
          out="dist/${APK_PREFIX}-v${base}-${variant}.apk"
          cp "$APK_SRC" "$out"
          echo "apk=${out}" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Verify signature
        env:
          APK: ${{ steps.rename.outputs.apk }}
        run: |
          set -e
          echo "--- apksigner verify: $APK ---"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -3
          ls -lh "$APK"

      # 生成该应用的发版说明草稿（各自独立版本日志与提交范围，互不混入）：
      #   --app qbot --path qbot-app          → CHANGELOG-qbot.md
      #   --app injector --path injector-app  → CHANGELOG-qbot-injector.md
      # 草稿落盘为文件（不落 $GITHUB_OUTPUT）：正文可能含引号/反引号，走文件避免 shell 插值破坏。
      - name: Generate release notes
        env:
          APP: ${{ steps.target.outputs.app }}
          APP_PATH: ${{ steps.target.outputs.app_path }}
          APP_PREFIX: ${{ steps.target.outputs.prefix }}
          TAG: ${{ steps.target.outputs.tag }}
          APP_VER: ${{ steps.target.outputs.ver }}
        run: |
          set -e
          mkdir -p dist
          prev_tag=$(git tag --sort=-creatordate | grep -E "^${APP_PREFIX}[0-9]" | grep -v -F "$TAG" | head -1 || true)
          args=(--app "$APP" --path "$APP_PATH" --cur "$TAG" --version "$APP_VER" --date "$(date +%Y-%m-%d)")
          if [ -n "$prev_tag" ]; then
            args+=(--prev "$prev_tag")
          fi
          python3 scripts/gitops/release-log.py "${args[@]}" > dist/notes.md
          echo "已生成发版说明草稿：dist/notes.md"

      # 保留已更新的 Release 内容（与主应用 / Logviewer 逻辑一致）：正文若已被人工补齐则不覆盖，
      # 标题若已含「—」概括则保留。
      - name: Preserve existing release content
        id: preserve
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
          APP_VER: ${{ steps.target.outputs.ver }}
        run: |
          set -e
          local_delimiter="EOF_$(date +%s%N)"
          existing=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" || echo "")
          final_body="$(cat dist/notes.md)"
          final_name="${APP_NAME} v${APP_VER}"
          if echo "$existing" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('id') else 1)" 2>/dev/null; then
            existing_body=$(echo "$existing" | python3 -c "import json,sys; print(json.load(sys.stdin).get('body',''))")
            existing_name=$(echo "$existing" | python3 -c "import json,sys; print(json.load(sys.stdin).get('name',''))")
            if ! echo "$existing_body" | grep -qE "请补充|请提炼|_（"; then
              final_body="$existing_body"
            fi
            if echo "$existing_name" | grep -q "—"; then
              final_name="$existing_name"
            fi
          fi
          {
            echo "body<<${local_delimiter}"
            echo "$final_body"
            echo "${local_delimiter}"
            echo "name<<${local_delimiter}"
            echo "$final_name"
            echo "${local_delimiter}"
          } >> "$GITHUB_OUTPUT"

      # 发版格式硬校验门禁（与主应用 / Logviewer 一致）
      - name: Validate release notes (hard checks)
        env:
          BODY: ${{ steps.preserve.outputs.body }}
        run: |
          set -e
          echo "--- 硬校验：emoji ---"
          if echo "$BODY" | grep -qP '[\x{1F300}-\x{1F9FF}]|[\x{2600}-\x{27BF}]'; then
            echo "::error::Release 正文包含 emoji，违反发版规范"
            exit 1
          fi
          echo "  PASS: 无 emoji"
          echo "--- 硬校验完成 ---"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          # 标题基础格式「{软件名} v{版本号}」，发版后必须手动补充「— 更新内容概括」（≤20字，用户语言）
          name: ${{ steps.preserve.outputs.name }}
          body: ${{ steps.preserve.outputs.body }}
          files: |
            ${{ steps.rename.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
